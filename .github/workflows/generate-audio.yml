name: Generate desktop pronunciation
on:
  push:
    paths:
      - .github/workflows/generate-audio.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install piper-tts
      - run: python -m piper.download_voices en_GB-alan-medium
      - name: Render clear British pronunciations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audio/desktop
          for word in fat hat hand have has Pam lake plane Jane plate; do
            printf '%s\n' "$word" | python -m piper -m en_GB-alan-medium -f "/tmp/$word.wav"
            ffmpeg -hide_banner -loglevel error -y -i "/tmp/$word.wav" -codec:a libmp3lame -q:a 3 "audio/desktop/$word.mp3"
          done
      - name: Commit recorded audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/desktop/
          git commit -m "Add fixed desktop word audio"
          git push
