<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ловцы звуков — A</title><meta name="description" content="Игра на чтение английских слов со звуками /æ/ и /eɪ/.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%232c4fc9'/%3E%3Ctext x='32' y='45' font-family='Arial' font-size='39' font-weight='bold' text-anchor='middle' fill='white'%3EA%3C/text%3E%3C/svg%3E">
<style>
:root{font-family:'Trebuchet MS',Arial,sans-serif;color:#14234a;background:#dff3ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 9%,#fff3a4 0 7%,transparent 19%),radial-gradient(circle at 91% 78%,#ffd1e5 0 8%,transparent 21%),#def2ff}main{max-width:1030px;margin:auto;padding:24px 16px 48px}header{text-align:center}h1{font-size:clamp(2rem,6vw,3.5rem);color:#254ec6;margin:6px 0 4px;text-shadow:2px 3px white}header p{margin:0 0 16px;font-size:1.1rem}.panel{background:#fff;border:4px solid #fff;border-radius:30px;box-shadow:0 11px 0 #b0d3e9,0 15px 28px #356aa52b;padding:24px;margin-top:20px}.tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.tab,.button{border:0;border-radius:18px;cursor:pointer;font:800 1rem 'Trebuchet MS',Arial,sans-serif;padding:13px 22px;background:#ecf1ff;color:#2546a1;box-shadow:0 4px 0 #b6c4ec}.tab[aria-selected=true],.button{background:#3158d8;color:white;box-shadow:0 4px 0 #1e3999}.tab:focus-visible,.button:focus-visible,.word:focus-visible,.target:focus-visible{outline:3px solid #f39b22;outline-offset:3px}h2{text-align:center;font-size:1.35rem;margin:4px 0 18px}.sounds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.sound{border-radius:25px;padding:20px;background:#fff0be;border:3px solid #ffd868}.sound:last-child{background:#d9d0ff;border-color:#ae9af9}.sound-title{font-size:2.3rem;font-weight:900;color:#a65300}.sound:last-child .sound-title{color:#5238a1}.sound p{margin:4px 0 16px}.words{display:flex;flex-wrap:wrap;gap:10px}.word{cursor:pointer;border:2px solid #fff;border-radius:14px;background:white;color:#172a59;padding:9px 13px;font:800 1.12rem 'Trebuchet MS',Arial,sans-serif;box-shadow:0 4px 0 #d7c69f}.sound:last-child .word{box-shadow:0 4px 0 #b9ade2}.word:hover,.target:hover,.button:hover,.tab:hover{transform:translateY(-2px)}.hint{text-align:center;color:#496088;margin:20px 0 0}.play-card{text-align:center}.progress{font-weight:bold;color:#4c6393;margin-bottom:14px}.bigword{font-size:clamp(3rem,12vw,6rem);font-weight:900;color:#244bc1;margin:10px 0}.speak{font-size:1.1rem}.targets{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:25px auto 5px;max-width:660px}.target{border:4px solid #ffd968;border-radius:25px;background:#fff0be;color:#a65300;min-height:122px;cursor:pointer;font:900 2rem 'Trebuchet MS',Arial,sans-serif;box-shadow:0 6px 0 #dcb652}.target:last-child{background:#ded7ff;color:#5238a1;border-color:#ae9af9;box-shadow:0 6px 0 #917ace}.target small{display:block;font-size:.54em;font-weight:700;margin-top:3px}.feedback{min-height:2em;font-size:1.1rem;font-weight:800;margin:16px 0}.good{color:#227d3c}.retry{color:#aa433b}.score{font-size:1.3rem;font-weight:800}.hidden{display:none}.end{font-size:1.2rem;line-height:1.5}.end strong{font-size:2rem;color:#254ec6}@media(max-width:620px){main{padding:13px 11px 38px}.panel{padding:16px;border-radius:22px}.sounds{grid-template-columns:1fr}.sound{padding:15px}.target{min-height:105px;font-size:1.6rem}header p{font-size:1rem}}
</style>
</head>
<body><main><header><h1>Ловцы звуков</h1><p>Прочитай слово и найди, как звучит буква A</p></header>
<div class="tabs" role="tablist" aria-label="Режим игры"><button class="tab" id="learnTab" role="tab" aria-selected="true" aria-controls="learn">Слушать слова</button><button class="tab" id="playTab" role="tab" aria-selected="false" aria-controls="play">Играть</button></div>
<section class="panel" id="learn" role="tabpanel" aria-labelledby="learnTab"><h2>Нажми на слово, чтобы его услышать</h2><div class="sounds"><div class="sound"><div class="sound-title">A · /æ/</div><p>Короткий звук, как в <b>cat</b></p><div class="words" id="shortWords"></div></div><div class="sound"><div class="sound-title">A · /eɪ/</div><p>Долгий звук, как в <b>cake</b></p><div class="words" id="longWords"></div></div></div><p class="hint">Когда будешь готов, нажми «Играть».</p></section>
<section class="panel play-card hidden" id="play" role="tabpanel" aria-labelledby="playTab"><div id="round"><div class="progress" id="progress"></div><div class="bigword" id="currentWord"></div><button class="button speak" id="hear" type="button">🔊 Послушать слово</button><div class="targets"><button class="target" data-sound="short" type="button">A · /æ/<small>как в cat</small></button><button class="target" data-sound="long" type="button">A · /eɪ/<small>как в cake</small></button></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><button class="button hidden" id="next" type="button">Следующее слово →</button></div><div class="end hidden" id="end"><strong>Отлично! ⭐</strong><p id="result"></p><button class="button" id="again" type="button">Сыграть ещё раз</button></div></section></main>
<script>
const groups={short:['cat','fat','hat','bat','cap','black','can','hand','man','Dan','and','have','ant','has','Pam'],long:['cake','snake','lake','plane','Jane','name','plate','Dave']};
const $=id=>document.getElementById(id);let deck=[],index=0,points=0,answered=false,voice=null,desktopVoice=null;
const mobileAudio=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
function chooseVoice(){const all=speechSynthesis.getVoices();voice=all.find(v=>v.lang==='en-GB')||all.find(v=>v.lang.startsWith('en'))||null;
  const british=all.filter(v=>v.lang.toLowerCase()==='en-gb');
  desktopVoice=british.find(v=>/Google UK English Female|Microsoft Sonia|Microsoft Libby|Microsoft Ryan|Daniel|Serena/i.test(v.name))
    ||british.find(v=>/Google|Microsoft|Natural|Enhanced/i.test(v.name))
    ||british[0]||all.find(v=>v.lang.startsWith('en'))||null;
}if('speechSynthesis'in window){chooseVoice();speechSynthesis.addEventListener('voiceschanged',chooseVoice)}
function say(word){if(!('speechSynthesis'in window)){showAudioNotice();return}speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(word);
  if(mobileAudio){utterance.lang=voice?.lang||'en-GB';if(voice)utterance.voice=voice;utterance.rate=.82;utterance.pitch=1;speechSynthesis.speak(utterance);return}
  chooseVoice();utterance.lang=desktopVoice?.lang||'en-GB';if(desktopVoice)utterance.voice=desktopVoice;utterance.rate=.95;utterance.pitch=1;speechSynthesis.speak(utterance)
}
function showAudioNotice(){$('feedback').textContent='Озвучка недоступна в этом браузере.'}
for(const [sound,words] of Object.entries(groups)){const box=$(sound==='short'?'shortWords':'longWords');words.forEach(word=>{const b=document.createElement('button');b.className='word';b.type='button';b.textContent='🔊 '+word;b.addEventListener('click',()=>say(word));box.append(b)})}
function showTab(which){const playing=which==='play';$('learn').classList.toggle('hidden',playing);$('play').classList.toggle('hidden',!playing);$('learnTab').setAttribute('aria-selected',String(!playing));$('playTab').setAttribute('aria-selected',String(playing));window.speechSynthesis?.cancel();if(playing&&!deck.length)start()}
$('learnTab').onclick=()=>showTab('learn');$('playTab').onclick=()=>showTab('play');
function start(){deck=Object.entries(groups).flatMap(([sound,words])=>words.map(word=>({word,sound})));for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}index=0;points=0;$('end').classList.add('hidden');$('round').classList.remove('hidden');render()}
function render(){answered=false;$('currentWord').textContent=deck[index].word;$('progress').textContent=`Слово ${index+1} из ${deck.length} · ⭐ ${points}`;$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.add('hidden');document.querySelectorAll('.target').forEach(b=>b.disabled=false)}
$('hear').onclick=()=>say(deck[index].word);
document.querySelectorAll('.target').forEach(b=>b.onclick=()=>{if(answered)return;const correct=b.dataset.sound===deck[index].sound;if(correct){answered=true;points++;$('feedback').textContent='Верно! ⭐';$('feedback').className='feedback good';$('next').classList.remove('hidden');$('next').textContent=index===deck.length-1?'Посмотреть результат':'Следующее слово →';document.querySelectorAll('.target').forEach(x=>x.disabled=true);say(deck[index].word)}else{$('feedback').textContent='Попробуй ещё раз!';$('feedback').className='feedback retry'}});
$('next').onclick=()=>{index++;if(index===deck.length){$('round').classList.add('hidden');$('end').classList.remove('hidden');$('result').textContent=`Ты прочитал(а) ${deck.length} слова и собрал(а) ${points} звёзд!`;}else render()};$('again').onclick=start;
</script></body></html>
